name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install veraPDF (PDF/A validator used by the archive tests)
        # Invoke through bash (works even if the executable bit is lost, e.g. after a
        # Windows commit) and fail loudly, otherwise the PDF/A tests silently skip.
        run: |
          VERAPDF_PATH="$(bash scripts/install-verapdf.sh)"
          test -x "$VERAPDF_PATH"
          echo "VERAPDF=$VERAPDF_PATH" >> "$GITHUB_ENV"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest tests -q -rs

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run build

  package-windows:
    name: Windows backend package
    runs-on: windows-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Build backend executable
        working-directory: backend
        run: pyinstaller --noconfirm server.spec
      - name: Bundle Tesseract
        shell: pwsh
        run: ./scripts/bundle-tesseract.ps1
      - name: Smoke test packaged backend
        shell: pwsh
        run: ./scripts/smoke-test-backend.ps1
